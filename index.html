<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AI Study Planner</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family: 'Segoe UI', sans-serif;
}

body{
    background: linear-gradient(135deg,#dbeafe,#f5f3ff);
    min-height:100vh;
    padding:20px;
    color:#1f2937;
}

.container{
    max-width:1100px;
    margin:auto;
}

header{
    text-align:center;
    margin-bottom:30px;
}

header h1{
    font-size:3rem;
    color:#4338ca;
    margin-bottom:10px;
}

header p{
    color:#4b5563;
    font-size:1.05rem;
}

.main{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:25px;
}

.card{
    background:rgba(255,255,255,0.75);
    backdrop-filter:blur(12px);
    border-radius:20px;
    padding:25px;
    box-shadow:0 8px 30px rgba(0,0,0,0.08);
}

.card h2{
    margin-bottom:20px;
    color:#4338ca;
}

.form-group{
    margin-bottom:18px;
}

label{
    display:block;
    margin-bottom:8px;
    font-weight:600;
}

input,
textarea{
    width:100%;
    padding:14px;
    border:none;
    border-radius:12px;
    background:#f9fafb;
    font-size:15px;
    outline:none;
    border:1px solid #d1d5db;
    transition:0.3s;
}

input:focus,
textarea:focus{
    border-color:#6366f1;
    box-shadow:0 0 0 4px rgba(99,102,241,0.15);
}

textarea{
    resize:none;
    height:90px;
}

button{
    width:100%;
    padding:15px;
    border:none;
    border-radius:14px;
    background:#4f46e5;
    color:white;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
    transition:0.3s;
}

button:hover{
    background:#4338ca;
    transform:translateY(-2px);
}

.output{
    display:none;
}

.plan-box{
    background:white;
    padding:18px;
    border-radius:14px;
    margin-bottom:18px;
    border-left:6px solid #4f46e5;
}

.plan-box h3{
    margin-bottom:12px;
    color:#4338ca;
}

.plan-box ul{
    padding-left:20px;
}

.plan-box li{
    margin-bottom:10px;
    line-height:1.5;
}

.subject-tags{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    margin-top:10px;
}

.tag{
    background:#e0e7ff;
    color:#3730a3;
    padding:8px 14px;
    border-radius:30px;
    font-size:14px;
    font-weight:600;
}

.countdown{
    background:#ede9fe;
    color:#5b21b6;
    padding:12px;
    border-radius:12px;
    margin-top:15px;
    text-align:center;
    font-weight:bold;
}

.loading{
    text-align:center;
    padding:20px;
    display:none;
}

.loader{
    width:45px;
    height:45px;
    border:5px solid #ddd;
    border-top:5px solid #4f46e5;
    border-radius:50%;
    margin:auto;
    animation:spin 1s linear infinite;
}

@keyframes spin{
    100%{
        transform:rotate(360deg);
    }
}

@media(max-width:900px){

    .main{
        grid-template-columns:1fr;
    }

    header h1{
        font-size:2.2rem;
    }
}

</style>
</head>

<body>

<div class="container">

<header>
    <h1>📚 AI Study Planner</h1>
    <p>Create personalized AI-powered study schedules instantly</p>
</header>

<div class="main">

    <!-- INPUT SECTION -->

    <div class="card">

        <h2>Student Details</h2>

        <div class="form-group">
            <label>Student Name</label>
            <input type="text" id="name" placeholder="Enter your name">
        </div>

        <div class="form-group">
            <label>Subjects</label>
            <textarea id="subjects" placeholder="Math, Physics, Chemistry"></textarea>
        </div>

        <div class="form-group">
            <label>Daily Study Hours</label>
            <input type="number" id="hours" placeholder="Example: 5">
        </div>

        <div class="form-group">
            <label>Exam Date</label>
            <input type="date" id="examDate">
        </div>

        <div class="form-group">
            <label>Weak Subjects</label>
            <textarea id="weakSubjects" placeholder="Physics, Organic Chemistry"></textarea>
        </div>

        <button onclick="generatePlan()">
            Generate AI Study Plan ✨
        </button>

    </div>

    <!-- OUTPUT SECTION -->

    <div class="card">

        <div class="loading" id="loading">
            <div class="loader"></div>
            <p style="margin-top:15px;">AI is generating your smart study plan...</p>
        </div>

        <div class="output" id="output">

            <h2 id="studentTitle">Study Plan</h2>

            <div class="subject-tags" id="subjectTags"></div>

            <div class="countdown" id="countdown"></div>

            <div class="plan-box">
                <h3>📅 Daily Study Schedule</h3>
                <ul id="dailyPlan"></ul>
            </div>

            <div class="plan-box">
                <h3>🎯 Weekly Goals</h3>
                <ul id="weeklyGoals"></ul>
            </div>

            <div class="plan-box">
                <h3>🔁 Revision Strategy</h3>
                <ul id="revisionPlan"></ul>
            </div>

        </div>

    </div>

</div>

</div>

<script>

function generatePlan(){

    const name = document.getElementById("name").value;
    const subjects = document.getElementById("subjects").value;
    const hours = parseInt(document.getElementById("hours").value);
    const examDate = document.getElementById("examDate").value;
    const weakSubjects = document.getElementById("weakSubjects").value;

    if(!name || !subjects || !hours || !examDate){

        alert("Please fill all required fields.");
        return;
    }

    document.getElementById("loading").style.display = "block";
    document.getElementById("output").style.display = "none";

    setTimeout(() => {

        const subjectArray = subjects.split(",");
        const weakArray = weakSubjects.split(",");

        document.getElementById("studentTitle").innerText =
            `${name}'s AI Study Plan`;

        // Subject Tags

        let tagsHTML = "";

        subjectArray.forEach(subject => {

            tagsHTML += `
                <div class="tag">
                    ${subject.trim()}
                </div>
            `;
        });

        document.getElementById("subjectTags").innerHTML = tagsHTML;

        // Countdown

        const today = new Date();
        const exam = new Date(examDate);

        const diff = exam - today;

        const daysLeft = Math.ceil(diff / (1000 * 60 * 60 * 24));

        document.getElementById("countdown").innerHTML =
            `⏳ ${daysLeft} days remaining until your exam`;

        // Daily Plan

        let dailyHTML = "";

        const perSubjectHours =
            (hours / subjectArray.length).toFixed(1);

        subjectArray.forEach(subject => {

            dailyHTML += `
                <li>
                    Study <strong>${subject.trim()}</strong>
                    for ${perSubjectHours} hour(s)
                    with active recall practice.
                </li>
            `;
        });

        dailyHTML += `
            <li>
                Take 10-minute breaks after every study session.
            </li>

            <li>
                End your day with quick revision notes.
            </li>
        `;

        document.getElementById("dailyPlan").innerHTML = dailyHTML;

        // Weekly Goals

        let weeklyHTML = "";

        subjectArray.forEach(subject => {

            weeklyHTML += `
                <li>
                    Complete 2 chapters and 1 mock test in
                    <strong>${subject.trim()}</strong>.
                </li>
            `;
        });

        weeklyHTML += `
            <li>
                Revise all completed topics every Sunday.
            </li>
        `;

        document.getElementById("weeklyGoals").innerHTML = weeklyHTML;

        // Revision Plan

        let revisionHTML = "";

        weakArray.forEach(subject => {

            if(subject.trim() !== ""){

                revisionHTML += `
                    <li>
                        Spend extra 30 minutes improving
                        <strong>${subject.trim()}</strong>.
                    </li>
                `;
            }
        });

        revisionHTML += `
            <li>
                Solve previous year question papers every weekend.
            </li>

            <li>
                Use flashcards and short notes before sleeping.
            </li>
        `;

        document.getElementById("revisionPlan").innerHTML = revisionHTML;

        document.getElementById("loading").style.display = "none";
        document.getElementById("output").style.display = "block";

    }, 1800);

}

</script>

</body>
</html>
