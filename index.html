<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Study Planner - Pro</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
            --panel-bg: rgba(255, 255, 255, 0.85);
            --border-color: rgba(0, 0, 0, 0.08);
            --text-main: #0f172a;
            --text-muted: #475569;
            --primary: #4f46e5;
            --primary-glow: rgba(79, 70, 229, 0.15);
            --accent: #10b981;
            --card-inner: #ffffff;
        }

        [data-theme="dark"] {
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            --panel-bg: rgba(30, 41, 59, 0.75);
            --border-color: rgba(255, 255, 255, 0.08);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --primary: #6366f1;
            --primary-glow: rgba(99, 102, 241, 0.2);
            --accent: #34d399;
            --card-inner: rgba(15, 23, 42, 0.3);
        }

        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: var(--bg-gradient);
            color: var(--text-main);
            margin: 0;
            padding: 15px;
            min-height: 100vh;
            transition: background 0.3s, color 0.3s;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
        }

        nav {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 15px;
        }

        .theme-toggle {
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 8px 14px;
            border-radius: 30px;
            cursor: pointer;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.9rem;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        header h1 {
            font-size: 2rem;
            font-weight: 800;
            margin: 0 0 8px 0;
        }

        header p {
            margin: 0;
            color: var(--text-muted);
            font-size: 1rem;
        }

        .grid-layout {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
        }

        @media (min-width: 768px) {
            .grid-layout {
                grid-template-columns: 360px 1fr;
            }
        }

        .glass-panel {
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 14px;
            padding: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            height: fit-content;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-size: 0.8rem;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper i {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
        }

        input {
            width: 100%;
            padding: 10px 12px 10px 38px;
            background: var(--card-inner);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-main);
            font-size: 0.95rem;
            box-sizing: border-box;
            transition: all 0.2s;
        }

        input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px var(--primary-glow);
        }

        button.main-btn {
            width: 100%;
            background: var(--primary);
            color: white;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }

        /* Output Dashboard */
        .output-dashboard { display: none; }

        .dash-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 12px;
            margin-bottom: 15px;
        }

        .badge {
            background: rgba(16, 185, 129, 0.12);
            border: 1px solid var(--accent);
            color: var(--accent);
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 700;
        }

        .export-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 15px;
            background: var(--card-inner);
            padding: 10px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        .action-btn {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 5px;
            flex: 1;
            justify-content: center;
            min-width: 100px;
        }

        .action-btn:hover {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        .section-title {
            font-size: 1rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-muted);
            margin: 20px 0 10px 0;
            border-left: 3px solid var(--primary);
            padding-left: 8px;
        }

        /* Tracker Checkboxes */
        .tracker-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 15px;
        }

        .tracker-item {
            display: flex;
            align-items: center;
            gap: 10px;
            background: var(--card-inner);
            padding: 10px 12px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            cursor: pointer;
            font-size: 0.9rem;
        }

        .tracker-item input[type="checkbox"] {
            width: 16px;
            height: 16px;
            cursor: pointer;
        }

        .tracker-item.completed {
            opacity: 0.6;
            text-decoration: line-through;
        }

        .timeline-item {
            background: var(--card-inner);
            padding: 14px;
            border-radius: 8px;
            border-left: 4px solid var(--primary);
            margin-bottom: 10px;
            border-top: 1px solid var(--border-color);
            border-right: 1px solid var(--border-color);
            border-bottom: 1px solid var(--border-color);
        }

        .time-tag { font-weight: 700; font-size: 0.85rem; color: var(--primary); margin-bottom: 2px; }
        .timeline-item h4 { margin: 0 0 4px 0; font-size: 0.95rem; }
        .timeline-item p { margin: 0; font-size: 0.85rem; color: var(--text-muted); line-height: 1.4; }
    </style>
</head>
<body>

<div class="container">
    <nav>
        <button class="theme-toggle" onclick="toggleTheme()">
            <i class="fa-solid fa-moon"></i> <span id="themeText">Dark Mode</span>
        </button>
    </nav>

    <header>
        <h1>🎯 Smart Study Planner</h1>
        <p>Highly Personalized Scheduling & Tracker Dashboard</p>
    </header>

    <div class="grid-layout">
        <div class="glass-panel">
            <div class="form-group">
                <label>Student Name</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-user"></i>
                    <input type="text" id="studentName" placeholder="Your Name">
                </div>
            </div>
            <div class="form-group">
                <label>Subjects (Comma Separated)</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-book"></i>
                    <input type="text" id="subjects" placeholder="e.g., Python, SQL, Math">
                </div>
            </div>
            <div class="form-group">
                <label>Daily Study Hours</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-clock"></i>
                    <input type="number" id="hours" placeholder="e.g., 3" min="1" max="16">
                </div>
            </div>
            <div class="form-group">
                <label>Exam Date</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-calendar"></i>
                    <input type="date" id="examDate">
                </div>
            </div>
            <div class="form-group">
                <label>Weak Subject / Topic</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-triangle-exclamation"></i>
                    <input type="text" id="weakSubjects" placeholder="e.g., Math">
                </div>
            </div>
            <button class="main-btn" onclick="validateAndBuild()">
                <span>Generate Smart Plan</span>
                <i class="fa-solid fa-bolt"></i>
            </button>
        </div>

        <div class="glass-panel output-dashboard" id="outputDashboard">
            
            <div id="printArea">
                <div class="dash-header">
                    <div>
                        <h2 style="margin:0; font-size:1.3rem;" id="outName">Workspace Roadmap</h2>
                        <span id="outSubjects" style="font-size:0.8rem; color:var(--text-muted);">Active Tracks</span>
                    </div>
                    <div class="badge" id="outBadge">0 Days Left</div>
                </div>

                <div class="export-actions" data-html2pdf-ignore="true">
                    <button class="action-btn" onclick="copyPlanToClipboard()"><i class="fa-regular fa-copy"></i> Copy</button>
                    <button class="action-btn" onclick="downloadTxt()"><i class="fa-regular fa-file-lines"></i> TXT</button>
                    <button class="action-btn" onclick="downloadPdf()"><i class="fa-regular fa-file-pdf"></i> PDF</button>
                </div>

                <div class="section-title" data-html2pdf-ignore="true">Today's Progress Tracker</div>
                <div class="tracker-list" id="trackerList" data-html2pdf-ignore="true">
                    </div>

                <div class="section-title">Personalized Daily Hours Allocation</div>
                <div id="timelineContainer"></div>

                <div class="section-title">Target Weekly Goals</div>
                <div id="weeklyContainer"></div>
            </div>

        </div>
    </div>
</div>

<script>
    function toggleTheme() {
        const current = document.documentElement.getAttribute('data-theme');
        const target = current === 'dark' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', target);
        localStorage.setItem('theme', target);
        document.getElementById('themeText').innerText = target === 'dark' ? 'Light Mode' : 'Dark Mode';
    }

    window.onload = function() {
        const savedTheme = localStorage.getItem('theme') || 'light';
        if(savedTheme === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
        
        document.getElementById('studentName').value = localStorage.getItem('p_name') || '';
        document.getElementById('subjects').value = localStorage.getItem('p_subs') || '';
        document.getElementById('hours').value = localStorage.getItem('p_hours') || '';
        document.getElementById('examDate').value = localStorage.getItem('p_date') || '';
        document.getElementById('weakSubjects').value = localStorage.getItem('p_weak') || '';

        if(localStorage.getItem('p_name')) {
            validateAndBuild();
        }
    };

    function validateAndBuild() {
        const name = document.getElementById('studentName').value.trim();
        const subInput = document.getElementById('subjects').value.trim();
        const hours = parseFloat(document.getElementById('hours').value);
        const examDateVal = document.getElementById('examDate').value;
        const weak = document.getElementById('weakSubjects').value.trim();

        if(!name || !subInput || !hours || !examDateVal) {
            alert('❌ Please complete all fields to generate your roadmap.');
            return;
        }
        if(hours <= 0 || hours > 16) {
            alert('❌ Hours must be structured rationally between 1 and 16.');
            return;
        }

        localStorage.setItem('p_name', name);
        localStorage.setItem('p_subs', subInput);
        localStorage.setItem('p_hours', hours);
        localStorage.setItem('p_date', examDateVal);
        localStorage.setItem('p_weak', weak);

        const today = new Date();
        const exam = new Date(examDateVal);
        const diffDays = Math.ceil((exam - today) / (1000 * 60 * 60 * 24));

        if(diffDays < 0) {
            alert('❌ The target deadline cannot exist in past contexts.');
            return;
        }

        document.getElementById('outName').innerText = `${name}'s Smart Plan`;
        document.getElementById('outSubjects').innerText = `Subjects: ${subInput}`;
        document.getElementById('outBadge').innerText = `${diffDays} Days Left`;

        // Process Dynamic Time Splits based on Priority 1
        const subjectArray = subInput.split(',').map(s => s.trim()).filter(s => s.length > 0);
        let timeAllocationHTML = '';
        
        // Smarter dynamic logic breakdown
        let remainingHours = hours;
        let warmUpTime = 0.5; // Fixed 30 mins
        remainingHours -= warmUpTime;

        timeAllocationHTML += `
            <div class="timeline-item">
                <div class="time-tag">0.5 Hours (30 Mins)</div>
                <h4>Brain Warmup & Flashcard Review</h4>
                <p>Quickly review previous material to enhance standard active recall patterns.</p>
            </div>
        `;

        // If weak subject exists, give it half of the remaining study time
        if(weak && remainingHours > 0) {
            let weakAlloc = parseFloat((remainingHours * 0.5).toFixed(1));
            if(weakAlloc < 0.5) weakAlloc = 0.5;
            remainingHours = parseFloat((remainingHours - weakAlloc).toFixed(1));

            timeAllocationHTML += `
                <div class="timeline-item" style="border-left-color: #ef4444;">
                    <div class="time-tag">${weakAlloc} Hours</div>
                    <h4>Targeted Weak Topic Focus: [${weak}]</h4>
                    <p>Dedicated high-priority slot to clear blocks and solve practice questions.</p>
                </div>
            `;
        }

        // Divide the rest evenly among all other listed subjects
        if(subjectArray.length > 0 && remainingHours > 0) {
            const share = parseFloat((remainingHours / subjectArray.length).toFixed(1));
            subjectArray.forEach(sub => {
                if(share > 0) {
                    timeAllocationHTML += `
                        <div class="timeline-item" style="border-left-color: #3b82f6;">
                            <div class="time-tag">${share} Hours</div>
                            <h4>Core Domain Study: [${sub}]</h4>
                            <p>Focus on learning core textbook items and doing active study drills.</p>
                        </div>
                    `;
                }
            });
        }

        document.getElementById('timelineContainer').innerHTML = timeAllocationHTML;

        // Priority 2: Create Dynamic Weekly Sprints layout
        let weeklyHTML = '';
        const mainSub = subjectArray[0] || 'Core Concepts';
        const secondSub = subjectArray[1] || 'Secondary Modules';

        weeklyHTML += `
            <div class="timeline-item" style="border-left-color: var(--accent);">
                <div class="time-tag">Week 1 Sprint</div>
                <h4>Fundamentals & Core Layout</h4>
                <p>• Complete initial basics of [${mainSub}].<br>• Practice at least 15 entry-level standard questions.</p>
            </div>
            <div class="timeline-item" style="border-left-color: var(--accent);">
                <div class="time-tag">Week 2 Sprint</div>
                <h4>Advanced Drill Operations</h4>
                <p>• Dive deeper into [${secondSub}] mechanics.<br>• Run a timed revision test on your weak area: [${weak || 'General Review'}].</p>
            </div>
        `;
        document.getElementById('weeklyContainer').innerHTML = weeklyHTML;

        // Priority 3: Build State-Retained Interactive Checkboxes Tool
        setupTrackerBoxes();

        const dashboard = document.getElementById('outputDashboard');
        dashboard.style.display = 'block';
        dashboard.scrollIntoView({ behavior: 'smooth' });
    }

    function setupTrackerBoxes() {
        const tasks = ['Brain Warmup Session', 'Main Subject Study Block', 'Weak Subject Practice', 'Final Day Review'];
        let trackerHTML = '';
        
        tasks.forEach((task, index) => {
            const isChecked = localStorage.getItem(`chk_${index}`) === 'true';
            trackerHTML += `
                <label class="tracker-item ${isChecked ? 'completed' : ''}" id="lbl_${index}">
                    <input type="checkbox" id="chk_${index}" onchange="handleCheck(${index})" ${isChecked ? 'checked' : ''}>
                    <span>${task}</span>
                </label>
            `;
        });
        document.getElementById('trackerList').innerHTML = trackerHTML;
    }

    function handleCheck(index) {
        const box = document.getElementById(`chk_${index}`);
        const label = document.getElementById(`lbl_${index}`);
        localStorage.setItem(`chk_${index}`, box.checked);
        
        if(box.checked) {
            label.classList.add('completed');
        } else {
            label.classList.remove('completed');
        }
    }

    // Priority 4: Export Utilities
    function copyPlanToClipboard() {
        let text = `=== SMART STUDY PLAN ===\n` + document.getElementById('printArea').innerText;
        navigator.clipboard.writeText(text).then(() => alert('📋 Plan copied to clipboard successfully!'));
    }

    function downloadTxt() {
        let text = `=== SMART STUDY PLAN ===\n` + document.getElementById('printArea').innerText;
        const blob = new Blob([text], { type: 'text/plain' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'study-plan.txt';
        a.click();
    }

    function downloadPdf() {
        const element = document.getElementById('printArea');
        const opt = {
            margin:       10,
            filename:     'smart-study-plan.pdf',
            image:        { type: 'jpeg', quality: 0.98 },
            html2canvas:  { scale: 2, useCORS: true },
            jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
        };
        html2canvas: {
            // Force text colors to render correctly in dark mode print actions
            document.documentElement.setAttribute('data-theme', 'light');
        }
        html2pdf().set(opt).from(element).save().then(() => {
            const savedTheme = localStorage.getItem('theme') || 'light';
            document.documentElement.setAttribute('data-theme', savedTheme);
        });
    }
</script>

</body>
</html>
